[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-foundation"
version = "1.0.0a32"
description = "Independent modular Agent Foundation service"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic>=2.13,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<10"]
build = ["build>=1.2,<2"]
mcp = ["mcp>=1.12,<2"]
postgres = ["psycopg[binary]>=3.2,<4"]
projections = ["neo4j>=5.26,<6"]
all = ["mcp>=1.12,<2", "psycopg[binary]>=3.2,<4", "neo4j>=5.26,<6"]

[project.scripts]
agent-foundation-service = "agent_foundation.host.service_v2:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["agent_foundation*", "agent_foundation_contracts*"]

[tool.setuptools.package-data]
agent_foundation_contracts = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py311"
line-length = 110
